<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой день в одной странице</title>
<style>
  :root{
    --bg:#f4f5fb;
    --bg-accent:#e8ebff;
    --card:#ffffff;
    --text:#1b1d27;
    --muted:#7a7f95;
    --line:#e6e8f2;
    --accent:#5b5bd6;
    --accent-soft:#ececfb;
    --done:#22a06b;
    --danger:#e2564a;
    --shadow:0 2px 4px rgba(27,29,39,.04), 0 12px 32px rgba(27,29,39,.07);
    --radius:16px;
  }
  :root[data-theme="dark"]{
    --bg:#101219;
    --bg-accent:#171a26;
    --card:#191c27;
    --text:#eceef7;
    --muted:#8b90a6;
    --line:#262a38;
    --accent:#8b8bf0;
    --accent-soft:#232541;
    --done:#3ecf8e;
    --danger:#f0776b;
    --shadow:0 2px 4px rgba(0,0,0,.2), 0 12px 32px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(180deg,var(--bg-accent),var(--bg) 320px);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease,color .25s ease;
  }
  .wrap{max-width:720px;margin:0 auto;padding:32px 16px 80px}

  /* --- Шапка --- */
  header{margin-bottom:22px}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
  .date{color:var(--muted);font-size:15px;margin:0}
  .icon-btn{
    width:40px;height:40px;flex:none;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--card);color:var(--text);
    border-radius:12px;cursor:pointer;font-size:17px;
    transition:transform .15s ease,border-color .15s ease,background-color .15s ease;
  }
  .icon-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
  .icon-btn:active{transform:translateY(0) scale(.96)}

  /* --- Прогресс --- */
  .progress-card{
    margin-top:18px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  }
  .progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .progress-head b{font-size:15px;font-weight:600}
  .progress-head span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
  .bar i{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--done));
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }

  /* --- Добавление --- */
  form{
    display:flex;gap:8px;margin:20px 0 8px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:8px;box-shadow:var(--shadow);
  }
  input[type="time"],input[type="text"]{
    font:inherit;color:var(--text);background:transparent;border:0;outline:0;padding:10px;border-radius:10px;
  }
  input[type="time"]{width:112px;flex:none;border-right:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
  input[type="text"]{flex:1;min-width:0}
  input::placeholder{color:var(--muted)}
  .add{
    flex:none;border:0;border-radius:11px;background:var(--accent);color:#fff;
    font:600 15px/1 inherit;padding:0 18px;cursor:pointer;
    transition:transform .15s ease,opacity .15s ease;
  }
  .add:hover{opacity:.9}
  .add:active{transform:scale(.96)}

  /* --- Фильтры --- */
  .filters{display:flex;gap:6px;margin:16px 0 8px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:7px 14px;border-radius:99px;font-size:14px;cursor:pointer;
    transition:all .18s ease;
  }
  .chip:hover{color:var(--text)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* --- Список --- */
  .group-title{
    display:flex;align-items:center;gap:8px;
    margin:24px 0 10px;font-size:13px;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  }
  .group-title::after{content:"";flex:1;height:1px;background:var(--line)}

  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;box-shadow:0 1px 2px rgba(27,29,39,.03);
    animation:in .3s cubic-bezier(.2,.8,.2,1) both;
    transition:border-color .2s ease,transform .2s ease,opacity .25s ease;
  }
  li:hover{border-color:var(--accent)}
  li.leaving{opacity:0;transform:translateX(24px)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .check{
    width:24px;height:24px;flex:none;border-radius:8px;cursor:pointer;
    border:2px solid var(--line);background:transparent;
    display:grid;place-items:center;padding:0;
    transition:all .2s ease;
  }
  .check:hover{border-color:var(--accent)}
  .check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;
    stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s ease .05s}
  li.done .check{background:var(--done);border-color:var(--done)}
  li.done .check svg{stroke-dashoffset:0}

  .time{
    flex:none;font-size:13px;font-variant-numeric:tabular-nums;color:var(--accent);
    background:var(--accent-soft);padding:4px 9px;border-radius:8px;font-weight:600;
  }
  .text{flex:1;min-width:0;font-size:16px;line-height:1.4;word-break:break-word;outline:0;border-radius:6px}
  .text:focus{box-shadow:0 0 0 2px var(--accent)}
  li.done .text{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
  li.done .time{opacity:.5}

  .del{
    flex:none;width:30px;height:30px;border:0;background:transparent;color:var(--muted);
    border-radius:8px;cursor:pointer;font-size:18px;line-height:1;opacity:0;
    transition:all .18s ease;
  }
  li:hover .del,li:focus-within .del{opacity:1}
  .del:hover{background:var(--accent-soft);color:var(--danger)}

  .empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:15px}
  .empty div{font-size:34px;margin-bottom:10px}

  footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
  .link{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
  .link:hover{color:var(--danger)}
  .hint{color:var(--muted);font-size:13px}

  @media (max-width:520px){
    .wrap{padding:22px 12px 60px}
    h1{font-size:22px}
    form{flex-wrap:wrap}
    input[type="time"]{border-right:0;width:100px}
    input[type="text"]{width:100%;order:3}
    .del{opacity:1}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="top">
      <div>
        <h1>Мой день в одной странице</h1>
        <p class="date" id="today"></p>
      </div>
      <button class="icon-btn" id="theme" title="Сменить тему">🌙</button>
    </div>

    <div class="progress-card">
      <div class="progress-head">
        <b id="status">Хорошего дня!</b>
        <span id="counter">0 из 0</span>
      </div>
      <div class="bar"><i id="fill"></i></div>
    </div>
  </header>

  <form id="form">
    <input type="time" id="time" title="Время">
    <input type="text" id="text" placeholder="Что нужно сделать?" autocomplete="off" required>
    <button class="add" type="submit">Добавить</button>
  </form>

  <div class="filters">
    <button class="chip on" data-filter="all">Все</button>
    <button class="chip" data-filter="active">Осталось</button>
    <button class="chip" data-filter="done">Готово</button>
  </div>

  <div id="list"></div>

  <footer>
    <span class="hint">Двойной клик по задаче — изменить текст</span>
    <button class="link" id="clear">Очистить выполненные</button>
  </footer>

</div>

<script>
(function(){
  const KEY = 'my-day-tasks';
  const THEME_KEY = 'my-day-theme';

  let tasks = load();
  let filter = 'all';

  const $ = id => document.getElementById(id);
  const listEl = $('list');

  /* ---------- Хранилище ---------- */
  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch(e){ return []; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e){}
  }

  /* ---------- Дата ---------- */
  const d = new Date();
  $('today').textContent = d.toLocaleDateString('ru-RU',
    { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  /* ---------- Тема ---------- */
  const themeBtn = $('theme');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  }
  let theme = localStorage.getItem(THEME_KEY) ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
  themeBtn.onclick = () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, theme);
    applyTheme(theme);
  };

  /* ---------- Группы по времени суток ---------- */
  const GROUPS = [
    { id:'morning', title:'🌅 Утро',        test:h => h !== null && h < 12 },
    { id:'day',     title:'☀️ День',        test:h => h !== null && h >= 12 && h < 18 },
    { id:'evening', title:'🌙 Вечер',       test:h => h !== null && h >= 18 },
    { id:'any',     title:'📌 Без времени', test:h => h === null }
  ];
  const hourOf = t => t ? parseInt(t.slice(0,2), 10) : null;

  /* ---------- Отрисовка ---------- */
  function render(){
    const visible = tasks.filter(t =>
      filter === 'all' ? true : filter === 'done' ? t.done : !t.done
    ).sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99'));

    listEl.innerHTML = '';

    if (!visible.length){
      listEl.innerHTML = tasks.length
        ? '<div class="empty"><div>🎉</div>Здесь пусто — всё по этому фильтру сделано</div>'
        : '<div class="empty"><div>📝</div>План пока пуст. Добавь первое дело сверху</div>';
      updateProgress();
      return;
    }

    GROUPS.forEach(g => {
      const items = visible.filter(t => g.test(hourOf(t.time)));
      if (!items.length) return;

      const title = document.createElement('div');
      title.className = 'group-title';
      title.textContent = g.title;
      listEl.appendChild(title);

      const ul = document.createElement('ul');
      items.forEach(t => ul.appendChild(row(t)));
      listEl.appendChild(ul);
    });

    updateProgress();
  }

  function row(t){
    const li = document.createElement('li');
    li.className = t.done ? 'done' : '';

    const check = document.createElement('button');
    check.className = 'check';
    check.title = 'Отметить';
    check.innerHTML = '<svg viewBox="0 0 16 16"><polyline points="2,8.5 6,12.5 14,4"/></svg>';
    check.onclick = () => toggle(t.id);
    li.appendChild(check);

    if (t.time){
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = t.time;
      li.appendChild(time);
    }

    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = t.text;
    text.ondblclick = () => {
      text.contentEditable = 'true';
      text.focus();
      getSelection().selectAllChildren(text);
    };
    text.onblur = () => {
      text.contentEditable = 'false';
      const val = text.textContent.trim();
      if (val) { t.text = val; save(); }
      else { text.textContent = t.text; }
    };
    text.onkeydown = e => {
      if (e.key === 'Enter'){ e.preventDefault(); text.blur(); }
      if (e.key === 'Escape'){ text.textContent = t.text; text.blur(); }
    };
    li.appendChild(text);

    const del = document.createElement('button');
    del.className = 'del';
    del.title = 'Удалить';
    del.innerHTML = '&times;';
    del.onclick = () => remove(t.id, li);
    li.appendChild(del);

    return li;
  }

  function updateProgress(){
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const pct = total ? Math.round(done / total * 100) : 0;

    $('fill').style.width = pct + '%';
    $('counter').textContent = done + ' из ' + total;
    $('status').textContent =
      !total ? 'Хорошего дня!' :
      pct === 100 ? 'День закрыт полностью 🎉' :
      pct >= 50 ? 'Больше половины позади' :
      'Выполнено ' + pct + '%';
  }

  /* ---------- Действия ---------- */
  function toggle(id){
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    save();
    render();
  }

  function remove(id, li){
    li.classList.add('leaving');
    setTimeout(() => {
      tasks = tasks.filter(x => x.id !== id);
      save();
      render();
    }, 200);
  }

  $('form').onsubmit = e => {
    e.preventDefault();
    const text = $('text').value.trim();
    if (!text) return;
    tasks.push({ id: Date.now() + '' + Math.random(), text, time: $('time').value, done:false });
    save();
    $('text').value = '';
    $('time').value = '';
    $('text').focus();
    render();
  };

  document.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      chip.classList.add('on');
      filter = chip.dataset.filter;
      render();
    };
  });

  $('clear').onclick = () => {
    if (!tasks.some(t => t.done)) return;
    if (!confirm('Удалить все выполненные задачи?')) return;
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  };

  render();
})();
</script>
</body>
</html>
